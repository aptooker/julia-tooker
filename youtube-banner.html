<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║   JULIA PEREZ TOOKER — YouTube Channel Art Banner           ║
  ║   Size: 2560 × 1440 px  |  Safe zone: 1546 × 423 px        ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  HOW TO EXPORT AS PNG:                                       ║
  ║  1. Open this file in Google Chrome                          ║
  ║  2. Open DevTools: press F12 (or right-click > Inspect)      ║
  ║  3. Press Ctrl+Shift+P (Windows) / Cmd+Shift+P (Mac)         ║
  ║  4. Type "Capture full size screenshot" → press Enter        ║
  ║  5. Upload the saved PNG to YouTube Studio > Customization   ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Julia Perez Tooker — YouTube Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:       #c9a84c;
      --gold-light: #e8c97a;
      --dark:       #0e0e0e;
      --cream:      #f5f0e8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 2560px;
      height: 1440px;
      overflow: hidden;
      background: var(--dark);
    }

    /* ── Background ─────────────────────────────────────────── */
    .banner {
      width: 2560px;
      height: 1440px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 55% 65% at 50% 50%,
          #271c08 0%, #171108 45%, #0e0e0e 100%);
    }

    /* ── Corner L-brackets ──────────────────────────────────── */
    .corner {
      position: absolute;
      width: 90px;
      height: 90px;
      opacity: 0.45;
    }
    .corner-tl { top: 56px;    left: 90px;   border-top:    1px solid var(--gold); border-left:   1px solid var(--gold); }
    .corner-tr { top: 56px;    right: 90px;  border-top:    1px solid var(--gold); border-right:  1px solid var(--gold); }
    .corner-bl { bottom: 56px; left: 90px;   border-bottom: 1px solid var(--gold); border-left:   1px solid var(--gold); }
    .corner-br { bottom: 56px; right: 90px;  border-bottom: 1px solid var(--gold); border-right:  1px solid var(--gold); }

    /* ── Horizontal accent lines (flanking the safe zone) ───── */
    .h-line {
      position: absolute;
      left: 90px;
      right: 90px;
      height: 1px;
      background: linear-gradient(to right,
        transparent 0%, var(--gold) 12%, var(--gold) 88%, transparent 100%);
      opacity: 0.55;
    }
    .h-line-top    { top: 480px; }
    .h-line-bottom { bottom: 480px; }

    /* ── Small diamond ornament on each line ────────────────── */
    .h-line::before {
      content: '◆';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: var(--gold);
      opacity: 0.9;
      line-height: 1;
    }

    /* ── Main content block ─────────────────────────────────── */
    .content {
      position: relative;
      display: flex;
      align-items: center;
      gap: 72px;
      z-index: 10;
    }

    /* ── Logo ───────────────────────────────────────────────── */
    .logo {
      width: 226px;
      height: 226px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 0 28px rgba(201, 168, 76, 0.25));
    }

    /* ── Vertical gold divider ──────────────────────────────── */
    .v-divider {
      flex-shrink: 0;
      width: 1px;
      height: 210px;
      background: linear-gradient(to bottom,
        transparent 0%, var(--gold) 20%, var(--gold) 80%, transparent 100%);
      opacity: 0.75;
    }

    /* ── Text block ─────────────────────────────────────────── */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 108px;
      letter-spacing: 5px;
      color: var(--cream);
      line-height: 1;
      white-space: nowrap;
    }

    .name em {
      font-style: italic;
      color: var(--gold-light);
    }

    /* ── "SOPRANO" row with flanking lines ──────────────────── */
    .soprano-row {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .s-line {
      height: 1px;
      width: 90px;
      flex-shrink: 0;
      opacity: 0.55;
    }
    .s-line-left  { background: linear-gradient(to right, transparent, var(--gold)); }
    .s-line-right { background: linear-gradient(to left,  transparent, var(--gold)); }

    .soprano {
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 28px;
      letter-spacing: 16px;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="banner">

    <!-- Corner ornaments -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Horizontal accent lines -->
    <div class="h-line h-line-top"></div>
    <div class="h-line h-line-bottom"></div>

    <!-- Main content (within YouTube safe zone 1546 × 423 px) -->
    <div class="content">

      <img src="images/AdobeJTLogo.png" class="logo" alt="JT Logo">

      <div class="v-divider"></div>

      <div class="text-block">
        <div class="name">Julia Perez Tooker</div>

        <div class="soprano-row">
          <div class="s-line s-line-left"></div>
          <div class="soprano">Soprano</div>
          <div class="s-line s-line-right"></div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
