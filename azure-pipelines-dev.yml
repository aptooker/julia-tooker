# Dev pipeline: fast feedback on every push to a non-main branch.
# Runs the Playwright suite against the static site, then deploys it
# to a separate dev/staging Azure Static Web App (julia-tooker-site-
# 2d1a71) so you can actually browse what's on this branch. This is
# independent of the live production site, which GitHub Actions still
# deploys to GitHub Pages untouched.
trigger:
  branches:
    include:
      - '*'
    exclude:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install test dependencies'

  - script: npx playwright install --with-deps chromium webkit
    displayName: 'Install Playwright browsers'

  # Soft gate: a failing test surfaces in the Tests tab below but
  # doesn't turn the whole run red while you're actively iterating.
  # The prod pipeline (triggered on main) is strict instead.
  - script: npx playwright test
    displayName: 'Run Playwright tests'
    continueOnError: true
    env:
      CI: 'true'

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/junit.xml'
      failTaskOnFailedTests: false
    displayName: 'Publish test results'

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: 'playwright-report'
      artifact: 'playwright-report'
    displayName: 'Publish HTML report'

  # Deploys regardless of test outcome (always()) so the dev site
  # always reflects the latest push - useful for visually checking a
  # change even when a test or two is red. Only the actual site files
  # are staged (not api/, tests/, node_modules, etc.) so the deploy
  # stays small and doesn't publish unrelated project files.
  - script: |
      mkdir -p dist
      cp index.html staticwebapp.config.json dist/
      cp -r images dist/
    condition: always()
    displayName: 'Stage static site files for deploy'

  - task: AzureStaticWebApp@0
    condition: always()
    inputs:
      app_location: 'dist'
      output_location: ''
      skip_app_build: true
      azure_static_web_apps_api_token: $(SWA_DEV_DEPLOYMENT_TOKEN)
    displayName: 'Deploy to dev Static Web App'
